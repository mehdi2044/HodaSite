<script>
/* ------------------------------------------------------------------

   only (IR from the running FID-6 demo; TR/CA scaled). In the app every
   amount comes from resolveShoppableScene / getVariantDisplayPrices.
   ------------------------------------------------------------------ */
var P = new URLSearchParams(location.search);
var L = P.get('lang') || 'fa';
var S0 = +(P.get('slide') || 0);
document.documentElement.lang = L; document.documentElement.dir = L === 'fa' ? 'rtl' : 'ltr';
var MK = {fa:'IR', tr:'TR', en:'CA'}[L];
function money(ir){
  if (L === 'fa') return new Intl.NumberFormat('fa-IR').format(ir) + ' تومان';
  if (L === 'tr') return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Math.round(ir * 0.000583333 * 10) / 10);
  return new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Math.round(ir * 0.0000233333 * 10) / 10);
}
var T = function(fa, tr, en){ return {fa:fa, tr:tr, en:en}[L]; };
var G = {
  coat:   {n:T('بارانی رها','Raha trençkot','Raha trench coat'), p:6720000},
  bag:    {n:T('کیف دستی هانا','Hana tote çanta','Hana tote'), p:5160000},
  shirt:  {n:T('اورشرت سپهر','Sepehr üst gömlek','Sepehr overshirt'), p:4080000},
  chino:  {n:T('شلوار چینو بردیا','Bardia chino','Bardia chinos'), p:3240000},
  kknit:  {n:T('ژاکت بافت باران','Baran hırka','Baran cardigan'), p:2280000},
  ktrous: {n:T('شلوار نرم آریو','Ariyo yumuşak pantolon','Ariyo soft trousers'), p:1680000},

  mknit:  {n:T('بافت آراد','Arad kazak','Arad sweater'), p:4320000},

};
/* Per slide: copySide is PHYSICAL (the image's empty side). subject = horizontal

   mobile (m) coordinates on the garment itself. fx/fy = object-position. */
var SLIDES = [

   body:T('ست کامل را ببین، هر قطعه را با سایز خودش انتخاب کن یا اول روی مدل امتحانش کن.','Kombini keşfet; kendi bedenini seç veya önce model üzerinde dene.','Explore the look; choose your size or try it on the store model first.'),

   body:T('سه قطعه که با هم یا جدا کار می‌کنند؛ برای هر روز هفته.','Birlikte ya da ayrı giyilen üç parça; haftanın her günü için.','Three pieces that work together or apart, every day of the week.'),

   body:T('بافت‌های نرم و پارچه‌های نخی برای بدوبدوهای پاییزی.','Sonbahar koşturmacası için yumuşak örgüler ve pamuklu kumaşlar.','Soft knits and cotton fabrics for autumn running around.'),

   sub:T('<b>اتاق پروی هوشمند</b> — ترکیبت را روی مدل ببین','<b>Akıllı deneme odası</b> — kombinini modelde gör','<b>Smart fitting room</b> — see your look on the model'),
   body:T('تا چهار قطعه انتخاب کن و همان لحظه روی مدل فروشگاه ببین.','Dört parçaya kadar seç, mağaza modelinde anında gör.','Pick up to four pieces and see them on the store model instantly.'),
   cta:[T('ورود به اتاق پرو','Deneme odasına gir','Enter the fitting room')], accent:true,
   pins:[{g:'wknit', d:[.665,.30], m:[.62,.25]}, {g:'wtrous', d:[.695,.62], m:[.55,.60]}, {g:'bag', d:[.765,.74], m:[.33,.66]}]}
];
var esc = function(s){ return s; };
function slideHtml(s, i){
  var fa = new Intl.NumberFormat(L === 'fa' ? 'fa-IR' : L);
  var pins = s.pins.map(function(p, n){ var g = G[p.g];
    return '<li class="m4-pin" data-moda4="hero-pin" data-n="' + (n + 1) + '" style="--px-d:' + p.d[0] + ';--py-d:' + p.d[1] + ';--px-m:' + p.m[0] + ';--py-m:' + p.m[1] + '">' +
      '<a href="#" aria-label="' + g.n + ' · ' + money(g.p) + '"><span class="m4-dot" aria-hidden="true">' + fa.format(n + 1) + '</span>' +
      '<span class="m4-tag" aria-hidden="true"><b>' + g.n + '</b><bdi>' + money(g.p) + '</bdi></span></a></li>'; }).join('');
  var strip = '<ul class="m4-strip" data-moda4="hero-prices" aria-label="prices">' + s.pins.map(function(p, n){ var g = G[p.g];
      return '<li><i>' + fa.format(n + 1) + '</i><span>' + g.n + '</span><bdi>' + money(g.p) + '</bdi></li>'; }).join('') + '</ul>';
  var fl = s.float ? '<figure class="m4-float" data-moda4="hero-float" hidden><img src="' + ASSET(s.float.img) + '" alt=""><figcaption><span class="note">' +
      G[s.float.g].n + ' · ' + money(G[s.float.g].p) + '<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="50" cy="20" rx="47" ry="17" fill="none" stroke="#FF6A1A" stroke-width="2.4" filter="url(#crayon-line)"/></svg></span></figcaption></figure>' : '';
  var acts = s.cta.map(function(c, n){ return '<a href="#" class="cbtn' + (n ? ' ghost' : (s.accent ? ' accent' : '')) + '" data-moda4-cta>' + c + '</a>'; }).join('');
  return '<article class="m4-slide' + (i === S0 ? ' is-active' : '') + '" data-moda4="hero-slide" data-slide="' + i + '" data-copy-side="' + s.copySide + '" ' +
    'style="--ar-d:' + s.d.ar + ';--fx-d:' + s.d.fx + ';--ar-m:' + s.m.ar + ';--fx-m:' + s.m.fx + ';--x0:' + s.subject.x0 + ';--x1:' + s.subject.x1 + '">' +
    '<picture class="m4-media"><source media="(max-width:760px), (min-width:761px) and (max-width:1099px) and (orientation:portrait)" srcset="' + ASSET(s.m.img) + '">' +
    '<img src="' + ASSET(s.d.img) + '" alt=""></picture>' +
    '<div class="m4-subject" data-moda4="hero-subject"></div>' +
    '<ol class="m4-pins">' + pins + '</ol>' + fl +
    '<div class="m4-copy" data-moda4="hero-copy">' +
      '<p class="m4-eyebrow">' + s.eyebrow + '</p>' +
      (i === 0 ? '<h1' : '<h2') + ' class="m4-title" data-moda4="hero-title" data-moda4-display dir="ltr" lang="en">' + s.title[0] + ' <em>' + s.title[1] + '</em>' + (i === 0 ? '</h1>' : '</h2>') +
      '<div class="m4-sub">' + s.sub + '</div><p class="m4-body">' + s.body + '</p>' + strip +
      '<div class="m4-acts">' + acts + '</div></div></article>';
}
var hero = document.getElementById('hero');
hero.innerHTML = SLIDES.map(slideHtml).join('') +
  '<div class="m4-ui"><div class="wrap"><div class="m4-bars" data-moda4="hero-progress">' +
  SLIDES.map(function(s, i){ return '<button type="button"' + (i === S0 ? ' aria-current="true"' : '') + '><i></i><span>' + s.title.join(' ') + '</span></button>'; }).join('') +
  '</div><div class="m4-arrows"><button class="ib" aria-label="prev"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="ib" aria-label="next"><svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button></div></div></div>';
/* pins use the desktop or mobile coordinates through the same switch as the image */
var css = document.createElement('style');
css.textContent = '.m4-pin{--px:var(--px-d);--py:var(--py-d)}@media (max-width:760px),(min-width:761px) and (max-width:1099px) and (orientation:portrait){.m4-pin{--px:var(--px-m);--py:var(--py-m)}}';
document.head.appendChild(css);
document.getElementById('navs').innerHTML = [T('زنانه','Kadın','Women'),T('مردانه','Erkek','Men'),T('بچگانه','Çocuk','Kids'),T('اکسسوری','Aksesuar','Accessories'),T('اتاق پرو','Deneme odası','Fitting room')].map(function(x){ return '<a href="#">' + x + '</a>'; }).join('');
document.getElementById('annMsg').textContent = T('کالکشن پاییز و زمستان ۱۴۰۵ رسید','Sonbahar / Kış 26 koleksiyonu geldi','The Autumn / Winter 26 collection is here');
document.getElementById('mk').innerHTML = ['IR','TR','CA'].map(function(m){ return '<span' + (m === MK ? ' aria-current="true"' : '') + '>' + m + '</span>'; }).join('');
document.getElementById('lk').innerHTML = [['fa','فا'],['tr','TR'],['en','EN']].map(function(m){ return '<span' + (m[0] === L ? ' aria-current="true"' : '') + '>' + m[1] + '</span>'; }).join('');
function relayout(){ [].forEach.call(document.querySelectorAll('.m4-slide'), function(s){ s.style.visibility = 'visible'; MODA4Hero.layoutHeroSlide(s); s.style.visibility = ''; }); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout); else relayout();
addEventListener('resize', relayout);
window.__relayout = relayout;
</script>
