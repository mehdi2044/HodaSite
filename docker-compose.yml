# Production stack. Local development uses docker-compose.dev.yml.
# All credentials come from .env (see .env.example) — nothing is hard-coded
# here, and the app is reachable only through Caddy (no host port on `app`).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - media:/data

  # One-shot: apply migrations before `app` starts. Built from the `ops` stage
  # because that image ships the full Prisma CLI (the runner image does not).
  migrate:
    build:
      context: .
      target: ops
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: [.env]
    environment:
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cron:
    image: curlimages/curl
    restart: unless-stopped
    command: >
      sh -c 'while true; do sleep 60;
      curl -fsS -X POST -H "Authorization: Bearer $${CRON_SECRET}"
      http://app:3000/api/cron/tick || true; done'
    env_file: [.env]
    depends_on: [app]

  ops:
    build:
      context: .
      target: ops
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: http://app:3000
      APP_SRC: /app
      MEDIA_DIR: /data/media
      BACKUP_ROOT: /backups
    volumes:
      - media:/data/media
      - backups:/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  postgres_data: {}
  media: {}
  backups: {}
  caddy_data: {}
  caddy_config: {}
